name: Techstars Ventures
description: 'Techstars Ventures is the venture-capital arm of Techstars, the global
  pre-seed accelerator and investor founded in 2006 in Boulder, Colorado. Techstars
  backs early-stage founders with capital, three months of intensive mentorship, and
  access to a worldwide network of investors, operators, and corporate partners across
  accelerator programs in cities including Boulder, Boston, Chicago, London, New York,
  and Tokyo. Its portfolio spans fintech, health, critical infrastructure, and software,
  and includes companies such as Uber, Twilio, ClassPass, DigitalOcean, Chainalysis,
  and Remitly. This profile was surfaced as a portfolio company of foundry-group and
  enriched into the API Evangelist network.'
